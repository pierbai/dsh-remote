<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DSH">
<meta name="theme-color" content="#151517">
<title>DSH Remote</title>
<style>
  :root{
    --bg:#101012; --panel:#1a1a1e; --panel2:#222228; --line:#2c2c34;
    --fg:#e8e8ec; --dim:#8b8b96; --accent:#4f6ef7; --accent2:#7b93ff;
    --user:#2b4bd6; --ok:#34c77b; --err:#e5534b; --warn:#e8a33d;
    --radius:14px; --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",sans-serif;
    font-size:16px; overscroll-behavior:none}
  #app{display:flex; flex-direction:column; height:100%; max-width:820px; margin:0 auto}

  /* ---- pairing view ---- */
  #pair{display:flex; flex-direction:column; justify-content:center; gap:18px;
    padding:32px 28px; height:100%}
  #pair h1{font-size:26px; margin:0; text-align:center}
  #pair p.sub{color:var(--dim); text-align:center; margin:0 0 8px}
  #pair input{background:var(--panel); border:1px solid var(--line); color:var(--fg);
    border-radius:12px; padding:14px 16px; font-size:22px; text-align:center;
    letter-spacing:8px; outline:none}
  #pair input:focus{border-color:var(--accent)}
  #pair button{background:var(--accent); color:#fff; border:none; border-radius:12px;
    padding:14px; font-size:17px; font-weight:600}
  #pair button:active{opacity:.8}
  #pairErr{color:var(--err); text-align:center; min-height:20px; font-size:14px}

  /* ---- chat view ---- */
  #chat{display:none; flex-direction:column; height:100%}
  header{display:flex; align-items:center; gap:10px; padding:calc(var(--safe-t) + 8px) 12px 8px;
    border-bottom:1px solid var(--line); background:var(--bg); position:sticky; top:0; z-index:5}
  header .title{flex:1; min-width:0}
  header .title .t1{font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  header .title .t2{font-size:11.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  header button{background:var(--panel); border:1px solid var(--line); color:var(--fg);
    border-radius:10px; padding:8px 11px; font-size:13px}
  #statusDot{width:9px; height:9px; border-radius:50%; background:var(--err); flex:none; transition:background .3s}
  #statusDot.ok{background:var(--ok)}

  #msgs{flex:1; overflow-y:auto; padding:14px 12px calc(10px + var(--safe-b));
    -webkit-overflow-scrolling:touch}
  .msg{margin:10px 0; display:flex; flex-direction:column; max-width:92%}
  .msg.user{align-self:flex-end; align-items:flex-end; margin-left:auto}
  .msg .bubble{border-radius:var(--radius); padding:11px 14px; line-height:1.55;
    white-space:pre-wrap; word-break:break-word; font-size:15.5px}
  .msg.user .bubble{background:var(--user); color:#fff; border-bottom-right-radius:4px}
  .msg.assistant .bubble{background:var(--panel); border:1px solid var(--line);
    border-bottom-left-radius:4px; white-space:normal}
  .msg .thinking{color:var(--dim); font-size:13px; border-left:3px solid var(--line);
    padding:2px 10px; margin:6px 0; white-space:pre-wrap; max-height:120px; overflow-y:auto}
  .msg .meta{font-size:11px; color:var(--dim); margin:3px 2px}
  .msg .tools{font-size:12.5px; color:var(--warn); background:rgba(232,163,61,.08);
    border:1px solid rgba(232,163,61,.25); border-radius:8px; padding:6px 10px;
    margin:4px 0; font-family:ui-monospace,Menlo,monospace; word-break:break-all}
  .errbox{color:var(--err); background:rgba(229,83,75,.08); border:1px solid rgba(229,83,75,.3);
    border-radius:10px; padding:10px 12px; margin:10px 0; font-size:14px}
  .bubble code{font-family:ui-monospace,Menlo,monospace; font-size:13.5px;
    background:var(--panel2); padding:1px 5px; border-radius:5px}
  .bubble pre{background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    padding:10px; overflow-x:auto; margin:8px 0; white-space:pre}
  .bubble pre code{background:none; padding:0}
  .bubble h2,.bubble h3,.bubble h4,.bubble h5{margin:10px 0 4px; line-height:1.3}
  .bubble h2{font-size:17px} .bubble h3{font-size:15.5px}
  .bubble h4,.bubble h5{font-size:14.5px}
  .bubble ul,.bubble ol{margin:6px 0; padding-left:22px}
  .bubble li{margin:3px 0}
  .bubble a{color:var(--accent2)}
  .bubble blockquote{margin:6px 0; padding:2px 10px; color:var(--dim);
    border-left:3px solid var(--line)}
  .bubble hr{border:none; border-top:1px solid var(--line); margin:10px 0}
  .bubble p{margin:6px 0}
  .typing{display:inline-flex; gap:4px; padding:4px 0}
  .typing i{width:6px; height:6px; border-radius:50%; background:var(--dim); animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25} 40%{opacity:1}}

  footer{border-top:1px solid var(--line); background:var(--bg);
    padding:8px 10px calc(10px + var(--safe-b))}
  #inputRow{display:flex; gap:8px; align-items:flex-end}
  #promptInput{flex:1; background:var(--panel); border:1px solid var(--line); color:var(--fg);
    border-radius:20px; padding:11px 16px; font-size:16px; outline:none; resize:none;
    max-height:120px; font-family:inherit; line-height:1.4}
  #promptInput:focus{border-color:var(--accent)}
  #sendBtn{background:var(--accent); border:none; color:#fff; width:42px; height:42px;
    border-radius:50%; font-size:19px; flex:none; display:flex; align-items:center; justify-content:center}
  #sendBtn:disabled{opacity:.4}
  #sendBtn.busy{background:var(--err)}

  /* sheet for sessions */
  #sheetBk{display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:20}
  #sheet{position:fixed; left:0; right:0; bottom:0; background:var(--panel);
    border-radius:18px 18px 0 0; z-index:21; padding:10px 0 calc(14px + var(--safe-b));
    display:none; max-height:70%; overflow-y:auto}
  #sheet h3{margin:6px 18px 10px; font-size:15px; color:var(--dim)}
  .sess{display:flex; align-items:center; gap:10px; padding:12px 18px}
  .sess:active{background:var(--panel2)}
  .sess .info{flex:1; min-width:0}
  .sess .name{font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .sess .sub{font-size:11.5px; color:var(--dim)}
  .sess .del{color:var(--err); font-size:13px; padding:6px 8px}
  .newSess{display:block; width:calc(100% - 36px); margin:10px 18px; padding:12px;
    background:var(--accent); color:#fff; border:none; border-radius:12px; font-size:15px; font-weight:600}
</style>
</head>
<body>
<div id="app">

  <!-- pairing -->
  <div id="pair">
    <h1>DSH Remote</h1>
    <p class="sub">连接到 ZBook 上的 DeepSeek Harness</p>
    <input id="pinInput" type="tel" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off">
    <button id="pairBtn">配对</button>
    <div id="pairErr"></div>
  </div>

  <!-- chat -->
  <div id="chat">
    <header>
      <div id="statusDot"></div>
      <div class="title" id="sessTitle">
        <div class="t1">DSH</div>
        <div class="t2" id="sessSub">未连接</div>
      </div>
      <button id="sessBtn">会话</button>
    </header>
    <div id="msgs"></div>
    <footer>
      <div id="inputRow">
        <textarea id="promptInput" rows="1" placeholder="发消息…"></textarea>
        <button id="sendBtn">↑</button>
      </div>
    </footer>
  </div>

  <!-- sessions sheet -->
  <div id="sheetBk"></div>
  <div id="sheet">
    <h3>会话</h3>
    <div id="sessList"></div>
    <button class="newSess" id="newSessBtn">＋ 新会话</button>
  </div>
</div>

<script>
"use strict";
/* ================= config ================= */
/* Master Ably key: used only for the pairing transaction and token refresh;
   after pairing, every call switches to the restricted 1h token. (Same
   threat model as the existing .dsh bridge scripts where this key lives
   in plaintext; PIN + randomized response channel + restricted tokens are
   the defense layers.) */
const ABLY_KEY = "OqFv1g.0TNSMQ:iYNFmDSogB4GlqqofDf-TZBWF076rCEFzqKV6NYpAd4";
const CH_REQ = "dsh-ios-req";
let CH_RESP = null;   // randomized; delivered after pairing

/* ================= tiny ably REST client (no dependency) ================= */
let ablyCred = () => "Basic " + btoa(ABLY_KEY);   // default: master key
async function ablyRest(method, path, body, timeout = 15000) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeout);
  try {
    const r = await fetch("https://rest.ably.io" + path, {
      method, signal: ctl.signal,
      headers: {
        "Authorization": ablyCred(),
        "Content-Type": "application/json",
      },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const text = await r.text();
    let j = null;
    try { j = JSON.parse(text); } catch (e) { /* not json */ }
    return { status: r.status, ok: r.ok, json: j, text };
  } finally { clearTimeout(timer); }
}

async function ablyPublish(data) {
  return ablyRest("POST", `/channels/${CH_REQ}/messages`,
    [{ name: "m", data: JSON.stringify(data) }]);
}

/* poll dsh-ios-resp; call onMsg(msgObj) for each new message */
let pollTimer = null, lastSerial = null, seen = new Set(), authFailures = 0;
async function startPolling(onMsg) {
  stopPolling();
  const loop = async () => {
    try {
      const q = new URLSearchParams({ limit: "100", direction: "backwards" });
      const r = await ablyRest("GET", `/channels/${CH_RESP || store.respChannel}/messages?${q}`);
      if (r.ok && Array.isArray(r.json)) {
        authFailures = 0;
        // backwards: newest first; process oldest->newest
        const arr = r.json.slice().reverse();
        for (const m of arr) {
          if (m.serial === null || seen.has(m.serial)) continue;
          seen.add(m.serial);
          let d; try { d = JSON.parse(m.data); } catch (e) { continue; }
          onMsg(d, m);
        }
        // keep the seen set bounded
        if (seen.size > 5000) seen = new Set([...seen].slice(-2500));
        setStatus(true);
      } else if (r.status === 401 || r.status === 403) {
        // restricted token expired: refresh it; if that fails, re-pair
        authFailures++;
        if (authFailures === 1) { await refreshToken(); }
        else if (authFailures > 3) { unpair(); return; }
        setStatus(false);
      } else {
        setStatus(false);
      }
    } catch (e) {
      setStatus(false);
    }
    pollTimer = setTimeout(loop, 1500);
  };
  loop();
}
function unpair() {
  stopPolling();
  store.pairToken = "";
  store.ablyToken = "";
  store.respChannel = "";
  ablyCred = () => "Basic " + btoa(ABLY_KEY);
  $("chat").style.display = "none";
  $("pair").style.display = "flex";
  $("pairErr").textContent = "连接已失效,请重新配对";
}
function stopPolling() { if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; } }

/* ================= state ================= */
const store = {
  get pairToken() { return localStorage.getItem("dsh_pair") || ""; },
  set pairToken(v) { v ? localStorage.setItem("dsh_pair", v) : localStorage.removeItem("dsh_pair"); },
  get ablyToken() { return localStorage.getItem("dsh_ably") || ""; },
  set ablyToken(v) { v ? localStorage.setItem("dsh_ably", v) : localStorage.removeItem("dsh_ably"); },
  get respChannel() { return localStorage.getItem("dsh_resp_ch") || ""; },
  set respChannel(v) { v ? localStorage.setItem("dsh_resp_ch", v) : localStorage.removeItem("dsh_resp_ch"); },
  get sessions() { return JSON.parse(localStorage.getItem("dsh_sessions") || "[]"); },
  set sessions(v) { localStorage.setItem("dsh_sessions", JSON.stringify(v)); },
  get active() { return localStorage.getItem("dsh_active") || ""; },
  set active(v) { v ? localStorage.setItem("dsh_active", v) : localStorage.removeItem("dsh_active"); },
};

let sessions = store.sessions;       // [{id,title,ts}]
let activeSession = store.active;
let busy = false;                    // a task is streaming
let pending = null;                  // {id, prompt} awaiting events
let liveThinking = "";               // current streaming thinking text
let liveText = "";                    // current streaming text
let liveEl = null;                    // in-progress message element

const $ = (id) => document.getElementById(id);

/* ================= ui helpers ================= */
function setStatus(ok) {
  $("statusDot").classList.toggle("ok", ok);
  const t = $("sessTitle").querySelector(".t2") || $("sessSub");
  t.textContent = busy ? "任务运行中…" : (ok ? "已连接" : "连接断开");
}
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function mdLite(s) {
  // markdown subset: fenced code, headings, lists, bold/italic, links, inline code
  const esc = escapeHtml(s);
  const lines = esc.split("\n");
  const out = [];
  let inCode = false, codeBuf = [], listType = null;

  const inline = (t) => t
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
              '<a href="$2" target="_blank" rel="noopener">$1</a>');

  const flushList = () => {
    if (listType) { out.push(`</${listType}>`); listType = null; }
  };

  for (const line of lines) {
    if (/^```/.test(line.trim())) {
      if (inCode) { out.push(`<pre><code>${codeBuf.join("\n")}</code></pre>`); codeBuf = []; inCode = false; }
      else { flushList(); inCode = true; }
      continue;
    }
    if (inCode) { codeBuf.push(line); continue; }

    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) { flushList(); const n = h[1].length; out.push(`<h${n + 1}>${inline(h[2])}</h${n + 1}>`); continue; }

    const ul = line.match(/^\s*[-*•]\s+(.*)/);
    const ol = line.match(/^\s*(\d+)[.)]\s+(.*)/);
    if (ul || ol) {
      const want = ul ? "ul" : "ol";
      if (listType !== want) { flushList(); out.push(`<${want}>`); listType = want; }
      out.push(`<li>${inline((ul ? ul[1] : ol[2]))}</li>`);
      continue;
    }

    flushList();
    if (line.trim() === "") { out.push(""); continue; }
    // blockquote
    const q = line.match(/^&gt;\s?(.*)/);
    if (q) { out.push(`<blockquote>${inline(q[1])}</blockquote>`); continue; }
    // horizontal rule
    if (/^\s*([-*_])\s*\1\s*\1[\s\S]*$/.test(line) && line.trim().length >= 3) { out.push("<hr>"); continue; }
    out.push(`<p>${inline(line)}</p>`);
  }
  if (inCode) out.push(`<pre><code>${codeBuf.join("\n")}</code></pre>`);
  flushList();
  return out.join("\n");
}
function scrollBottom() {
  const el = $("msgs");
  requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}

function addMsg(role, html, cls) {
  const wrap = document.createElement("div");
  wrap.className = `msg ${role}`;
  const bub = document.createElement("div");
  bub.className = "bubble" + (cls ? " " + cls : "");
  bub.innerHTML = html;
  wrap.appendChild(bub);
  $("msgs").appendChild(wrap);
  scrollBottom();
  return bub;
}
function addUserMsg(text) { addMsg("user", escapeHtml(text)); }
function addErr(text) { addMsg("assistant", `<div class="errbox">${escapeHtml(text)}</div>`); }

function ensureLiveMsg() {
  if (!liveEl) {
    const wrap = document.createElement("div");
    wrap.className = "msg assistant";
    wrap.innerHTML = `<div class="bubble"><div class="thinking" style="display:none"></div><div class="body"></div><div class="typing"><i></i><i></i><i></i></div></div>`;
    $("msgs").appendChild(wrap);
    liveEl = { wrap, thinking: wrap.querySelector(".thinking"), body: wrap.querySelector(".body"), typing: wrap.querySelector(".typing") };
    scrollBottom();
  }
  return liveEl;
}
function finishLiveMsg() {
  if (!liveEl) return;
  liveEl.typing.remove();
  const text = liveText || "";
  liveEl.body.innerHTML = mdLite(text) || '<span style="color:var(--dim)">（无回复）</span>';
  if (liveThinking) {
    const t = document.createElement("div");
    t.className = "thinking";
    t.textContent = liveThinking;
    liveEl.wrap.insertBefore(t, liveEl.body);
  }
  liveEl = null; liveThinking = ""; liveText = "";
  scrollBottom();
}
function updateLive() {
  const el = ensureLiveMsg();
  if (liveThinking) {
    el.thinking.style.display = "";
    el.thinking.textContent = liveThinking;
  }
  el.body.innerHTML = mdLite(liveText);
  scrollBottom();
}
function addToolLine(name, argPreview) {
  const el = ensureLiveMsg();
  const d = document.createElement("div");
  d.className = "tools";
  d.textContent = `⚙ ${name} ${argPreview}`;
  el.wrap.insertBefore(d, el.typing);
  scrollBottom();
}

/* ================= pairing ================= */
async function doPair() {
  const pin = $("pinInput").value.trim();
  $("pairErr").textContent = "";
  if (!/^\d{6}$/.test(pin)) { $("pairErr").textContent = "请输入 6 位 PIN"; return; }
  const nonce = crypto.getRandomValues(new Uint8Array(16)).reduce(
    (s, b) => s + b.toString(16).padStart(2, "0"), "");
  const pairCh = `dsh-ios-pair-${nonce}`;
  const id = "req-" + crypto.randomUUID();
  const r = await ablyPublish({ id, kind: "pair", pin, nonce });
  if (!r.ok) { $("pairErr").textContent = "网络错误: " + r.status; return; }
  // poll the one-time pairing channel for the result
  const resp = await pollChannelFor(pairCh, m => m.id === id, 25000);
  if (!resp) { $("pairErr").textContent = "配对超时,请确认 ZBook 在线"; return; }
  if (!resp.ok) { $("pairErr").textContent = resp.error || "配对失败"; return; }
  store.pairToken = resp.pairToken;
  store.ablyToken = resp.ablyToken;
  if (resp.respChannel) store.respChannel = resp.respChannel;
  enterChat();
}

async function pollChannelFor(channel, match, timeoutMs) {
  const t0 = Date.now();
  while (Date.now() - t0 < timeoutMs) {
    try {
      const q = new URLSearchParams({ limit: "20", direction: "backwards" });
      const r = await ablyRest("GET", `/channels/${channel}/messages?${q}`);
      if (r.ok && Array.isArray(r.json)) {
        for (const m of r.json.slice().reverse()) {
          let d; try { d = JSON.parse(m.data); } catch (e) { continue; }
          if (match(d)) return d;
        }
      }
    } catch (e) { /* retry */ }
    await new Promise(res => setTimeout(res, 1200));
  }
  return null;
}

/* refresh the restricted ably token (1h TTL) while pairToken is valid;
   the reply arrives on a one-time nonce channel like pairing, because the
   current token may already have expired when refresh triggers */
let refreshTimer = null;
async function refreshToken() {
  if (!store.pairToken) return;
  const nonce = crypto.getRandomValues(new Uint8Array(16)).reduce(
    (s, b) => s + b.toString(16).padStart(2, "0"), "");
  const pairCh = `dsh-ios-pair-${nonce}`;
  const id = "req-" + crypto.randomUUID();
  // the whole refresh round-trip runs on the master key: the current
  // restricted token may be expired, and the reply lands on the nonce
  // channel which the key can read anyway.
  ablyCred = () => "Basic " + btoa(ABLY_KEY);
  const r = await ablyPublish({ id, kind: "refresh", pairToken: store.pairToken, nonce });
  if (!r.ok) {
    ablyCred = () => store.ablyToken ? "Bearer " + store.ablyToken : ablyCred;
    scheduleRefresh(5 * 60 * 1000); return;  // retry in 5min
  }
  const resp = await pollChannelFor(pairCh, m => m.id === id, 20000);
  if (resp && resp.ok && resp.ablyToken) {
    store.ablyToken = resp.ablyToken;
    ablyCred = () => "Bearer " + store.ablyToken;
    if (resp.respChannel) { store.respChannel = resp.respChannel; CH_RESP = resp.respChannel; }
    authFailures = 0;
    scheduleRefresh();
  } else if (resp && resp.ok === false) {
    if (resp.relogin) { unpair(); return; }   // pairToken rejected: re-pair
    ablyCred = () => "Bearer " + store.ablyToken;
    scheduleRefresh(5 * 60 * 1000);
  } else {
    ablyCred = () => "Bearer " + store.ablyToken;
    scheduleRefresh(5 * 60 * 1000);   // no reply; retry soon
  }
}
function scheduleRefresh(delayMs = 45 * 60 * 1000) {
  if (refreshTimer) clearTimeout(refreshTimer);
  refreshTimer = setTimeout(refreshToken, delayMs);
}

/* (pairing responses arrive on the one-time nonce channel — see doPair) */

/* ================= sessions ================= */
function sessTitle(id) {
  const s = sessions.find(x => x.id === activeSession);
  return s ? s.title : "新会话";
}
function saveSessionList() {
  store.sessions = sessions;
}
function newSession() {
  activeSession = "";
  store.active = "";
  $("msgs").innerHTML = "";
  $("sessTitle").querySelector(".t1").textContent = "新会话";
  hideSheet();
}
function switchSession(id) {
  activeSession = id; store.active = id;
  $("msgs").innerHTML = "";
  $("sessTitle").querySelector(".t1").textContent = sessTitle(id);
  hideSheet();
  addSystemNote("已切换会话(历史记录保存在 ZBook,此处不回放)");
}
function addSystemNote(text) {
  addMsg("assistant", `<span style="color:var(--dim)">${escapeHtml(text)}</span>`);
}
function showSheet() {
  const list = $("sessList");
  list.innerHTML = "";
  const sorted = [...sessions].sort((a, b) => b.ts - a.ts);
  for (const s of sorted) {
    const row = document.createElement("div");
    row.className = "sess";
    row.innerHTML = `<div class="info"><div class="name">${escapeHtml(s.title)}</div>
      <div class="sub">${new Date(s.ts).toLocaleString()}</div></div>
      <div class="del">删除</div>`;
    row.querySelector(".del").onclick = async (e) => {
      e.stopPropagation();
      sessions = sessions.filter(x => x.id !== s.id);
      if (activeSession === s.id) newSession();
      saveSessionList(); showSheet();
    };
    row.onclick = () => switchSession(s.id);
    list.appendChild(row);
  }
  $("sheetBk").style.display = "block";
  $("sheet").style.display = "block";
}
function hideSheet() { $("sheetBk").style.display = "none"; $("sheet").style.display = "none"; }

/* ================= prompt send ================= */
let pendingSince = 0;      // epoch ms of last activity for the pending task
let pendingTimer = null;
function touchPending() { pendingSince = Date.now(); }
function armPendingWatchdog() {
  disarmPendingWatchdog();
  touchPending();
  pendingTimer = setInterval(() => {
    if (!busy || !pending) { disarmPendingWatchdog(); return; }
    const idle = Date.now() - pendingSince;
    const TASK_LIMIT = 16 * 60 * 1000;   // bridge kills tasks at 15min
    if (idle > TASK_LIMIT) {
      // the bridge already gave up; recover the UI
      finishLiveMsg();
      setBusy(false);
      addErr("任务超时或事件流中断(超过 16 分钟无活动)。若 ZBook 仍在处理,结果不会同步显示。");
      pending = null;
      disarmPendingWatchdog();
    }
  }, 30 * 1000);
}
function disarmPendingWatchdog() {
  if (pendingTimer) { clearInterval(pendingTimer); pendingTimer = null; }
}
function setBusy(v) {
  busy = v;
  $("sendBtn").classList.toggle("busy", v);
  $("sendBtn").disabled = v;
  setStatus(true);
  if (v) armPendingWatchdog(); else disarmPendingWatchdog();
}
async function sendPrompt() {
  if (busy) return;
  const text = $("promptInput").value.trim();
  if (!text) return;
  $("promptInput").value = "";
  $("promptInput").style.height = "auto";
  addUserMsg(text);
  setBusy(true);

  let sid = activeSession;
  const isNew = !sid;
  const id = "req-" + crypto.randomUUID();
  pending = { id, prompt: text };
  const payload = {
    id, kind: "prompt", pairToken: store.pairToken,
    prompt: text, sessionId: sid || undefined,
  };
  const r = await ablyPublish(payload);
  if (!r.ok) {
    setBusy(false);
    addErr("发送失败: HTTP " + r.status);
    return;
  }
}

/* event handler for messages from bridge */
function onBridgeMsg(d) {
  // ack / error envelope (has .ok) for any request id we track
  if (d.ok !== undefined) {
    if (d.ok === true && d.sessionId && pending && d.id === pending.id) {
      // prompt accepted; adopt session id if this is a new session
      if (!activeSession) {
        activeSession = d.sessionId; store.active = d.sessionId;
        const title = pending.prompt.slice(0, 24);
        sessions.push({ id: d.sessionId, title, ts: Date.now() });
        saveSessionList();
        $("sessTitle").querySelector(".t1").textContent = title;
      }
    } else if (d.ok === false) {
      setBusy(false);
      addErr(d.error || "request failed");
      if (pending && d.id === pending.id) pending = null;
    }
    return;
  }
  if (pending && d.id === pending.id) {
    touchPending();   // any frame for the running task = alive
    if (d.evt === "error") {
      setBusy(false);
      addErr(d.message || "unknown error");
      pending = null; return;
    }
    if (d.evt === "dsh") handleDshEvent(d.d);
  }
}

function handleDshEvent(ev) {
  const t = ev.type;
  if (t === "session") {
    // record session identity
    if (!activeSession) {
      activeSession = ev.sessionId; store.active = ev.sessionId;
      const title = (pending ? pending.prompt : "会话").slice(0, 24);
      sessions.push({ id: ev.sessionId, title, ts: Date.now() });
      saveSessionList();
      $("sessTitle").querySelector(".t1").textContent = title;
    }
  } else if (t === "thinking") {
    liveThinking += ev.text || "";
    updateLive();
  } else if (t === "text") {
    liveText += ev.text || "";
    updateLive();
  } else if (t === "tool_call") {
    const name = ev.name || ev.tool || "tool";
    let argPreview = "";
    try {
      const a = typeof ev.arguments === "string" ? JSON.parse(ev.arguments || "{}") : ev.arguments;
      argPreview = a && typeof a === "object"
        ? Object.entries(a).map(([k, v]) => `${k}=${String(v).slice(0, 30)}`).join(" ").slice(0, 120)
        : "";
    } catch (e) { argPreview = String(ev.arguments || "").slice(0, 80); }
    addToolLine(name, argPreview);
  } else if (t === "status") {
    if (ev.phase === "turn_end") {
      const reason = ev.reason && ev.reason.kind;
      if (reason && reason !== "completed") {
        liveText += `\n\n[turn ended: ${reason}]`;
      }
    }
  } else if (t === "final") {
    // final is authoritative; prefer its text if we somehow missed streaming
    if (ev.text && !liveText) liveText = ev.text;
    finishLiveMsg();
    setBusy(false);
    pending = null;
  } else if (t === "error") {
    addErr(ev.message || "error");
    finishLiveMsg();
    setBusy(false);
    pending = null;
  }
}

/* ================= boot ================= */
function enterChat() {
  $("pair").style.display = "none";
  $("chat").style.display = "flex";
  // switch to the full restricted token for both publish and subscribe
  if (store.ablyToken) {
    ablyCred = () => "Bearer " + store.ablyToken;
    if (store.respChannel) CH_RESP = store.respChannel;
    scheduleRefresh();
  }
  if (store.active) {
    activeSession = store.active;
    const s = sessions.find(x => x.id === activeSession);
    $("sessTitle").querySelector(".t1").textContent = s ? s.title : "会话";
    addSystemNote("已恢复会话 " + (s ? s.title : activeSession.slice(0, 20)));
  } else {
    addSystemNote("已配对。开始新对话吧");
  }
  startPolling(onBridgeMsg);
}
$("pairBtn").onclick = doPair;
$("pinInput").addEventListener("keydown", e => { if (e.key === "Enter") doPair(); });
$("sendBtn").onclick = sendPrompt;
$("promptInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendPrompt(); }
});
$("promptInput").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 120) + "px";
});
$("sessBtn").onclick = showSheet;
$("newSessBtn").onclick = newSession;
$("sheetBk").onclick = hideSheet;

// auto-enter if already paired
if (store.pairToken) enterChat();

// iOS suspends timers when backgrounded/locked; on return to the foreground
// the poll loop restarts from Ably history (24h retention), so missed events
// — including `final` — are recovered. Force an immediate re-poll on wake.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    if (busy && pending) touchPending();   // don't fire the watchdog spuriously
    // the next scheduled poll may be far away after suspension; nudge it
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
    if ($("chat").style.display === "flex") startPolling(onBridgeMsg);
  }
});
</script>
