<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DSH">
<meta name="theme-color" content="#0f0f10">
<title>DSH</title>
<style>
  :root{
    --bg:#0f0f10; --sidebar:#151517; --panel:#1b1b1f; --panel2:#232329; --line:#2a2a31;
    --fg:#ececf1; --dim:#8e8e99; --dimmer:#5d5d66;
    --accent:#4f6ef7; --accent2:#8a9dff; --user:#3b5bdb;
    --ok:#34c77b; --err:#e5534b; --warn:#e8a33d;
    --radius:12px; --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",sans-serif;
    font-size:16px; overscroll-behavior:none}

  /* ===== app shell: sidebar + main ===== */
  #shell{display:flex; height:100%; max-width:1400px; margin:0 auto}

  /* ---- sidebar (conversation list, DSH style) ---- */
  #sidebar{width:280px; flex:none; background:var(--sidebar);
    border-right:1px solid var(--line); display:flex; flex-direction:column}
  #sbHead{padding:calc(var(--safe-t) + 14px) 14px 10px}
  #sbHead .brand{display:flex; align-items:center; gap:8px; font-weight:700; font-size:17px}
  #sbHead .brand .logo{width:26px; height:26px; border-radius:7px;
    background:linear-gradient(135deg,#4f6ef7,#7b3ff7); display:flex; align-items:center;
    justify-content:center; font-size:14px; color:#fff}
  #newChatBtn{margin-top:12px; width:100%; background:var(--panel); color:var(--fg);
    border:1px solid var(--line); border-radius:10px; padding:10px; font-size:14.5px;
    display:flex; align-items:center; justify-content:center; gap:6px; font-family:inherit}
  #newChatBtn:active{background:var(--panel2)}
  #sbList{flex:1; overflow-y:auto; padding:4px 8px calc(12px + var(--safe-b))}
  .convItem{padding:10px 12px; border-radius:10px; margin:2px 0; cursor:pointer;
    display:flex; flex-direction:column; gap:3px}
  .convItem:active, .convItem.active{background:var(--panel2)}
  .convItem .cTitle{font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--fg)}
  .convItem .cSub{font-size:11.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    display:flex; align-items:center; gap:6px}
  .dotRun{width:7px; height:7px; border-radius:50%; background:var(--warn); flex:none;
    animation:pulse 1.5s infinite}
  .dotOk{width:7px; height:7px; border-radius:50%; background:var(--ok); flex:none; opacity:.7}
  @keyframes pulse{0%,100%{opacity:1} 50%{opacity:.35}}

  /* ---- main ---- */
  #main{flex:1; display:flex; flex-direction:column; min-width:0; height:100%}
  #topbar{display:flex; align-items:center; gap:10px; padding:calc(var(--safe-t) + 10px) 14px 10px;
    border-bottom:1px solid var(--line); background:var(--bg); min-height:52px}
  #menuBtn{display:none; background:none; border:none; color:var(--fg); font-size:20px;
    padding:4px 8px; border-radius:8px}
  #topTitle{flex:1; min-width:0}
  #topTitle .t1{font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #topConn{font-size:11.5px; color:var(--dim); display:flex; align-items:center; gap:6px}
  #topDot{width:8px; height:8px; border-radius:50%; background:var(--err); flex:none}
  #topDot.ok{background:var(--ok)}

  #msgs{flex:1; overflow-y:auto; padding:16px 16px calc(12px + var(--safe-b));
    -webkit-overflow-scrolling:touch; scroll-behavior:smooth}
  .msg{margin:12px 0; display:flex; flex-direction:column; max-width:min(92%,720px)}
  .msg.user{align-self:flex-end; align-items:flex-end; margin-left:auto}
  .msg .bubble{border-radius:var(--radius); padding:12px 15px; line-height:1.6;
    word-break:break-word; font-size:15px}
  .msg.user .bubble{background:var(--user); color:#fff; border-bottom-right-radius:4px}
  .msg.assistant .bubble{background:var(--panel); border:1px solid var(--line);
    border-bottom-left-radius:4px}
  .msg .thinking{color:var(--dim); font-size:12.5px; border-left:2px solid var(--line);
    padding:2px 10px; margin:6px 0; white-space:pre-wrap; max-height:140px; overflow-y:auto}
  .msg .meta{font-size:11px; color:var(--dimmer); margin:3px 2px}
  .msg .tools{font-size:12px; color:var(--warn); background:rgba(232,163,61,.07);
    border:1px solid rgba(232,163,61,.2); border-radius:8px; padding:5px 10px;
    margin:4px 0; font-family:ui-monospace,Menlo,monospace; word-break:break-all}
  .turnSep{display:flex; align-items:center; gap:10px; margin:22px 0 10px;
    color:var(--dimmer); font-size:10.5px}
  .turnSep::before,.turnSep::after{content:""; flex:1; height:1px; background:var(--line)}
  .errbox{color:var(--err); background:rgba(229,83,75,.08); border:1px solid rgba(229,83,75,.3);
    border-radius:10px; padding:10px 12px; margin:10px 0; font-size:14px}
  .bubble code{font-family:ui-monospace,Menlo,monospace; font-size:13.5px;
    background:var(--panel2); padding:1px 5px; border-radius:5px}
  .bubble pre{background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    padding:11px; overflow-x:auto; margin:8px 0; white-space:pre}
  .bubble pre code{background:none; padding:0}
  .bubble h2,.bubble h3,.bubble h4,.bubble h5{margin:10px 0 4px; line-height:1.3}
  .bubble h2{font-size:16.5px} .bubble h3{font-size:15px}
  .bubble h4,.bubble h5{font-size:14px}
  .bubble ul,.bubble ol{margin:6px 0; padding-left:22px}
  .bubble li{margin:3px 0}
  .bubble a{color:var(--accent2)}
  .bubble blockquote{margin:6px 0; padding:2px 10px; color:var(--dim);
    border-left:3px solid var(--line)}
  .bubble hr{border:none; border-top:1px solid var(--line); margin:10px 0}
  .bubble p{margin:6px 0}
  .typing{display:inline-flex; gap:4px; padding:4px 0}
  .typing i{width:6px; height:6px; border-radius:50%; background:var(--dim); animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25} 40%{opacity:1}}
  .hint{color:var(--dimmer); text-align:center; padding:40px 20px; font-size:14px}

  #composer{border-top:1px solid var(--line); background:var(--bg);
    padding:10px 14px calc(12px + var(--safe-b))}
  #inputRow{display:flex; gap:10px; align-items:flex-end; max-width:760px; margin:0 auto}
  #promptInput{flex:1; background:var(--panel); border:1px solid var(--line); color:var(--fg);
    border-radius:22px; padding:11px 17px; font-size:16px; outline:none; resize:none;
    max-height:140px; font-family:inherit; line-height:1.45}
  #promptInput:focus{border-color:var(--accent)}
  #sendBtn{background:var(--accent); border:none; color:#fff; width:42px; height:42px;
    border-radius:50%; font-size:18px; flex:none; display:flex; align-items:center;
    justify-content:center; transition:background .2s}
  #sendBtn:disabled{opacity:.35}
  #sendBtn.busy{background:var(--err)}

  /* ---- pairing (fullscreen; visible by default so a JS failure never
       leaves a black page — JS hides it on enterApp) ---- */
  #pair{display:flex; flex-direction:column; justify-content:center; gap:18px;
    padding:32px 28px; height:100%; max-width:420px; margin:0 auto}
  #pair h1{font-size:24px; margin:0; text-align:center}
  #pair p.sub{color:var(--dim); text-align:center; margin:0 0 8px}
  #pair input{background:var(--panel); border:1px solid var(--line); color:var(--fg);
    border-radius:12px; padding:14px 16px; font-size:22px; text-align:center;
    letter-spacing:8px; outline:none}
  #pair input:focus{border-color:var(--accent)}
  #pair button{background:var(--accent); color:#fff; border:none; border-radius:12px;
    padding:14px; font-size:17px; font-weight:600; font-family:inherit}
  #pair button:active{opacity:.8}
  #pairErr{color:var(--err); text-align:center; min-height:20px; font-size:14px}

  /* ---- mobile: sidebar becomes an overlay drawer ---- */
  #sbBk{display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:30}
  @media (max-width:860px){
    #sidebar{position:fixed; left:0; top:0; bottom:0; z-index:31;
      transform:translateX(-100%); transition:transform .22s ease;
      box-shadow:8px 0 30px rgba(0,0,0,.4)}
    #sidebar.open{transform:translateX(0)}
    #sbBk.show{display:block}
    #menuBtn{display:block}
    #msgs{padding:14px 12px}
  }
</style>
</head>
<body>

<!-- pairing -->
<div id="pair">
  <h1>DSH</h1>
  <p class="sub">连接到 ZBook 上的 DeepSeek Harness</p>
  <input id="pinInput" type="tel" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off">
  <button id="pairBtn">配对</button>
  <div id="pairErr"></div>
  <div id="diag" style="font:11px/1.7 ui-monospace,monospace;color:var(--dimmer);text-align:left;margin-top:8px"></div>
</div>

<!-- app shell -->
<div id="shell" style="display:none">
  <div id="sbBk"></div>
  <nav id="sidebar">
    <div id="sbHead">
      <div class="brand"><span class="logo">D</span> DSH Remote</div>
      <button id="newChatBtn">＋ 新建会话</button>
    </div>
    <div id="sbList"><div class="hint">加载中…</div></div>
  </nav>
  <main id="main">
    <div id="topbar">
      <button id="menuBtn">☰</button>
      <div id="topTitle">
        <div class="t1" id="topT1">DSH</div>
        <div id="topConn"><span id="topDot"></span><span id="connText">连接中…</span></div>
      </div>
    </div>
    <div id="msgs"></div>
    <div id="composer">
      <div id="inputRow">
        <textarea id="promptInput" rows="1" placeholder="发消息…"></textarea>
        <button id="sendBtn">↑</button>
      </div>
    </div>
  </main>
</div>

<script>
"use strict";
/* global error surface: any uncaught error is painted on screen so a
   black page always tells us why */
window.addEventListener("error", (e) => {
  try {
    let box = document.getElementById("__errbox");
    if (!box) {
      box = document.createElement("div");
      box.id = "__errbox";
      box.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99;background:#5c1a17;color:#ffd9d6;padding:10px 14px;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;max-height:45vh;overflow:auto";
      (document.body || document.documentElement).appendChild(box);
    }
    box.textContent += "[error] " + (e.message || "unknown") +
      (e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : "") + "\n";
  } catch (_) { /* nothing more we can do */ }
});
window.addEventListener("unhandledrejection", (e) => {
  try {
    let box = document.getElementById("__errbox");
    if (!box) {
      box = document.createElement("div");
      box.id = "__errbox";
      box.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99;background:#5c1a17;color:#ffd9d6;padding:10px 14px;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;max-height:45vh;overflow:auto";
      (document.body || document.documentElement).appendChild(box);
    }
    const r = e.reason;
    box.textContent += "[promise] " + ((r && (r.stack || r.message)) || String(r)).slice(0, 400) + "\n";
  } catch (_) { }
});

/* ================= config ================= */
const ABLY_KEY = "OqFv1g.0TNSMQ:iYNFmDSogB4GlqqofDf-TZBWF076rCEFzqKV6NYpAd4";
const CH_REQ = "dsh-ios-req";
let CH_RESP = null;

/* ================= ably REST ================= */
let ablyCred = () => "Basic " + btoa(ABLY_KEY);
async function ablyRest(method, path, body, timeout = 20000) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeout);
  try {
    const r = await fetch("https://rest.ably.io" + path, {
      method, signal: ctl.signal,
      headers: { "Authorization": ablyCred(), "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const text = await r.text();
    let j = null; try { j = JSON.parse(text); } catch (e) {}
    return { status: r.status, ok: r.ok, json: j, text };
  } finally { clearTimeout(timer); }
}
async function ablyPublish(data) {
  return ablyRest("POST", `/channels/${CH_REQ}/messages`,
    [{ name: "m", data: JSON.stringify(data) }]);
}

/* reply-waiter registry */
const replyWaiters = {};
function waitReply(reqId, timeoutMs = 25000) {
  return new Promise(resolve => {
    replyWaiters[reqId] = { resolve };
    setTimeout(() => { if (replyWaiters[reqId]) { delete replyWaiters[reqId]; resolve(null); } }, timeoutMs);
  });
}

/* ---------- transport layer: local bridge API first, Ably fallback ----------
   On the ZBook (testing) the local API at :17891 is the fastest, most
   reliable path; on iPhone, Ably is the only route. Detect once at boot. */
let localBase = null;   // e.g. "http://localhost:17891" when reachable
async function detectLocalBridge() {
  for (const base of ["http://localhost:17891", "http://127.0.0.1:17891"]) {
    try {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), 2500);
      const r = await fetch(base + "/api/ping", { signal: ctl.signal });
      clearTimeout(t);
      if (r.ok) { localBase = base; return true; }
    } catch (e) { /* try next */ }
  }
  return false;
}

/* one request/response round trip through whichever transport is active */
async function bridgeCall(kind, extra = {}, timeoutMs = 25000) {
  if (localBase) {
    try {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), timeoutMs);
      const r = await fetch(localBase + "/api", {
        method: "POST", signal: ctl.signal,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ kind, pairToken: store.pairToken, ...extra }),
      });
      clearTimeout(t);
      const j = await r.json();
      return j && Object.keys(j).length ? j : { ok: false, error: "empty local reply" };
    } catch (e) {
      // local transport died; fall back to Ably for this call and re-detect later
      localBase = null;
      detectLocalBridge();
    }
  }
  const id = "req-" + crypto.randomUUID();
  const p = waitReply(id, timeoutMs);
  const r = await ablyPublish({ id, kind, pairToken: store.pairToken, ...extra });
  if (!r.ok) return { ok: false, error: "network " + r.status };
  return await p;
}

/* event poll loop */
let pollTimer = null, seen = new Set(), authFailures = 0;
function startPolling() {
  stopPolling();
  const loop = async () => {
    try {
      const ch = CH_RESP || store.respChannel;
      if (!ch) { pollTimer = setTimeout(loop, 2000); return; }
      const q = new URLSearchParams({ limit: "100", direction: "backwards" });
      const r = await ablyRest("GET", `/channels/${ch}/messages?${q}`);
      if (r.ok && Array.isArray(r.json)) {
        authFailures = 0;
        for (const m of r.json.slice().reverse()) {
          if (m.serial === null || seen.has(m.serial)) continue;
          seen.add(m.serial);
          let d; try { d = JSON.parse(m.data); } catch (e) { continue; }
          onFrame(d);
        }
        if (seen.size > 5000) seen = new Set([...seen].slice(-2500));
        setStatus(true);
      } else if (r.status === 401 || r.status === 403) {
        authFailures++;
        if (authFailures === 1) await refreshToken();
        else if (authFailures > 3) { unpair(); return; }
        setStatus(false);
      } else setStatus(false);
    } catch (e) { setStatus(false); }
    pollTimer = setTimeout(loop, 1500);
  };
  loop();
}
function stopPolling() { if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; } }

/* ================= state ================= */
const store = {
  get pairToken() { return localStorage.getItem("dsh_pair") || ""; },
  set pairToken(v) { v ? localStorage.setItem("dsh_pair", v) : localStorage.removeItem("dsh_pair"); },
  get ablyToken() { return localStorage.getItem("dsh_ably") || ""; },
  set ablyToken(v) { v ? localStorage.setItem("dsh_ably", v) : localStorage.removeItem("dsh_ably"); },
  get respChannel() { return localStorage.getItem("dsh_resp_ch") || ""; },
  set respChannel(v) { v ? localStorage.setItem("dsh_resp_ch", v) : localStorage.removeItem("dsh_resp_ch"); },
  get active() { return localStorage.getItem("dsh_active") || ""; },
  set active(v) { v ? localStorage.setItem("dsh_active", v) : localStorage.removeItem("dsh_active"); },
};

let activeSession = "";
let live = null;
let knownTasks = {};
let syncTimer = null;
let busy = false;
let convCache = [];   // sidebar list cache

const $ = (id) => document.getElementById(id);

/* ================= ui helpers ================= */
function setStatus(ok) {
  $("topDot").classList.toggle("ok", ok);
  $("connText").textContent = busy ? "任务运行中…" : (ok ? "已连接" : "连接断开");
}
function escapeHtml(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function mdLite(s) {
  const esc = escapeHtml(s);
  const lines = esc.split("\n");
  const out = []; let inCode = false, codeBuf = [], listType = null;
  const inline = (t) => t
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const flushList = () => { if (listType) { out.push(`</${listType}>`); listType = null; } };
  for (const line of lines) {
    if (/^```/.test(line.trim())) {
      if (inCode) { out.push(`<pre><code>${codeBuf.join("\n")}</code></pre>`); codeBuf = []; inCode = false; }
      else { flushList(); inCode = true; }
      continue;
    }
    if (inCode) { codeBuf.push(line); continue; }
    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) { flushList(); const n = h[1].length; out.push(`<h${n+1}>${inline(h[2])}</h${n+1}>`); continue; }
    const ul = line.match(/^\s*[-*•]\s+(.*)/);
    const ol = line.match(/^\s*(\d+)[.)]\s+(.*)/);
    if (ul || ol) {
      const want = ul ? "ul" : "ol";
      if (listType !== want) { flushList(); out.push(`<${want}>`); listType = want; }
      out.push(`<li>${inline(ul ? ul[1] : ol[2])}</li>`);
      continue;
    }
    flushList();
    if (line.trim() === "") { out.push(""); continue; }
    const q = line.match(/^&gt;\s?(.*)/);
    if (q) { out.push(`<blockquote>${inline(q[1])}</blockquote>`); continue; }
    out.push(`<p>${inline(line)}</p>`);
  }
  if (inCode) out.push(`<pre><code>${codeBuf.join("\n")}</code></pre>`);
  flushList();
  return out.join("\n");
}
function scrollBottom() {
  const el = $("msgs");
  requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}
function addMsg(role, html) {
  const wrap = document.createElement("div");
  wrap.className = `msg ${role}`;
  const bub = document.createElement("div");
  bub.className = "bubble";
  bub.innerHTML = html;
  wrap.appendChild(bub);
  $("msgs").appendChild(wrap);
  scrollBottom();
  return wrap;
}
function addUserMsg(text) { addMsg("user", escapeHtml(text)); }
function addErr(text) { addMsg("assistant", `<div class="errbox">${escapeHtml(text)}</div>`); }
function addTurnSep(label) {
  const d = document.createElement("div");
  d.className = "turnSep";
  d.textContent = label;
  $("msgs").appendChild(d);
}
function ensureLive() {
  if (!live.el) {
    const wrap = document.createElement("div");
    wrap.className = "msg assistant";
    wrap.innerHTML = `<div class="bubble"><div class="thinking" style="display:none"></div><div class="body"></div><div class="typing"><i></i><i></i><i></i></div></div>`;
    $("msgs").appendChild(wrap);
    live.el = { wrap, thinking: wrap.querySelector(".thinking"), body: wrap.querySelector(".body"), typing: wrap.querySelector(".typing") };
    scrollBottom();
  }
  return live.el;
}
function finishLive() {
  if (!live || !live.el) return;
  live.el.typing.remove();
  const text = live.finalText || live.text || "";
  live.el.body.innerHTML = mdLite(text) || '<span style="color:var(--dim)">（无回复）</span>';
  if (live.thinking) {
    const t = document.createElement("div");
    t.className = "thinking";
    t.textContent = live.thinking;
    live.el.wrap.insertBefore(t, live.el.body);
  }
  live.el = null;
  scrollBottom();
}
function updateLive() {
  const el = ensureLive();
  if (live.thinking) { el.thinking.style.display = ""; el.thinking.textContent = live.thinking; }
  el.body.innerHTML = mdLite(live.text);
  scrollBottom();
}
function addToolLine(name) {
  const el = ensureLive();
  const d = document.createElement("div");
  d.className = "tools";
  d.textContent = `⚙ ${name}`;
  el.wrap.insertBefore(d, el.typing);
  scrollBottom();
}
function openDrawer(open) {
  $("sidebar").classList.toggle("open", open);
  $("sbBk").classList.toggle("show", open);
}

/* ================= sidebar (conversation list) ================= */
async function loadSidebar() {
  $("sbList").innerHTML = '<div class="hint">加载中…</div>';
  const r = await bridgeCall("sessions");
  const list = $("sbList");
  if (!r || !r.ok) {
    list.innerHTML = `<div class="hint">${escapeHtml((r && r.error) || "列表加载失败")}</div>`;
    return;
  }
  convCache = r.sessions || [];
  list.innerHTML = "";
  if (!convCache.length) {
    list.innerHTML = '<div class="hint">还没有对话<br>点「＋ 新建会话」开始</div>';
    return;
  }
  for (const s of convCache) {
    const item = document.createElement("div");
    item.className = "convItem" + (s.session === activeSession ? " active" : "");
    const when = s.lastTs ? new Date(s.lastTs * 1000).toLocaleString() : "";
    const dot = s.running ? '<span class="dotRun"></span>' : '<span class="dotOk"></span>';
    item.innerHTML = `<div class="cTitle">${escapeHtml(s.title || s.session.slice(0, 24))}</div>
      <div class="cSub">${dot}<span>${when} · ${s.tasks.length} 任务</span></div>`;
    item.onclick = () => { openDrawer(false); openSession(s.session); };
    list.appendChild(item);
  }
}

/* ================= conversation view ================= */
async function openSession(sid) {
  activeSession = sid;
  store.active = sid;
  $("topT1").textContent = "加载中…";
  $("msgs").innerHTML = `<div class="hint">加载对话历史…</div>`;
  loadSidebar();  // refresh active highlight
  const r = await bridgeCall("session_events", { sessionId: sid }, 60000);
  $("msgs").innerHTML = "";
  if (!r || !r.ok) {
    if (r && /unknown session/i.test(r.error || "")) {
      store.active = ""; activeSession = "";
      $("topT1").textContent = "DSH";
      $("msgs").innerHTML = `<div class="hint">会话不存在(可能已过期)<br>从左侧选择其他会话</div>`;
      return;
    }
    addErr((r && r.error) || "加载失败");
    return;
  }
  $("topT1").textContent =
    ((r.turns[0] && r.turns[0].prompt) || sid.slice(0, 20)).slice(0, 40);
  if (!r.turns.length) {
    $("msgs").innerHTML = `<div class="hint">空会话,发第一条消息吧</div>`;
  }
  let runningTurn = null;
  for (const turn of r.turns) {
    knownTasks[turn.taskId] = true;
    addTurnSep(new Date((turn.startedAt || 0) * 1000).toLocaleString());
    addUserMsg(turn.prompt);
    if (turn.status === "running") {
      runningTurn = turn;
      live = { taskId: turn.taskId, prompt: turn.prompt,
               thinking: turn.thinking || "", text: turn.text || "", finalText: null, el: null };
      busy = true;
      continue;
    }
    renderFinishedTurn(turn);
  }
  if (runningTurn) {
    ensureLive(); updateLive(); setStatus(true);
    $("sendBtn").disabled = true; $("sendBtn").classList.add("busy");
  } else {
    busy = false;
    $("sendBtn").disabled = false; $("sendBtn").classList.remove("busy");
  }
  scrollBottom();
  startSync();
}
function renderFinishedTurn(turn) {
  if (turn.thinking) {
    const t = document.createElement("div");
    t.className = "thinking";
    t.textContent = turn.thinking;
    $("msgs").appendChild(t);
  }
  const text = turn.final || turn.text || "（无回复）";
  addMsg("assistant", mdLite(text));
  if (turn.status === "error") addErr("该任务未正常完成");
  if (turn.tools && turn.tools.length) {
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `工具调用 ${turn.tools.length} 次`;
    $("msgs").appendChild(meta);
  }
}
function startSync() {
  stopSync();
  if (localBase) {
    // local mode: fast 2s event streaming from the task's disk log
    syncTimer = setInterval(async () => {
      // capture the CURRENT task; discard the reply if the live task
      // changed while this round trip was in flight (stale-frame guard)
      const tid = live && live.taskId;
      if (!tid || !localBase) return;
      try {
        const t = await bridgeCall("tasklog", { taskId: tid }, 15000);
        if (t && t.ok) {
          if (!live || live.taskId !== tid) return;   // stale frame
          const evs = t.events || [];
          for (let i = live.evtIdx || 0; i < evs.length; i++) {
            handleDshEvent(evs[i]);
          }
          if (live) live.evtIdx = evs.length;
        }
      } catch (e) { /* next tick */ }
    }, 2000);
  }
  syncTimer2 = setInterval(runSessionSync, localBase ? 5000 : 10000);
  runSessionSync();
}
let syncTimer2 = null;
async function runSessionSync() {
  // universal fallback: if the live task is terminal on disk, release the UI
  if (busy && live && live.taskId) {
    const tid = live.taskId;   // guard: reply must still match the live task
    try {
      const t = await bridgeCall("tasklog", { taskId: tid }, 15000);
      if (live && live.taskId === tid && t && t.ok && t.status === "done") {
        live.finalText = t.final || live.text || "";
        releaseBusy();
        return;
      }
      if (live && live.taskId === tid && t && t.ok && t.status === "error") {
        addErr("任务失败");
        releaseBusy();
        return;
      }
    } catch (e) { /* fall through */ }
  }
  if (!activeSession) return;
  try {
    const r = await bridgeCall("session_sync",
      { sessionId: activeSession, knownTasks: Object.keys(knownTasks) }, 15000);
    if (!r || !r.ok) return;
    for (const f of (r.newFinished || [])) {
      knownTasks[f.taskId] = true;
      if (live && live.taskId === f.taskId) {
        live.finalText = f.final || live.text;
        finishLive();
        busy = false; live = null;
        $("sendBtn").disabled = false; $("sendBtn").classList.remove("busy");
      }
    }
    if (!r.running && busy) {
      const full = await bridgeCall("session_events", { sessionId: activeSession }, 60000);
      if (full && full.ok) {
        const last = full.turns[full.turns.length - 1];
        if (last && last.status !== "running") {
          if (live) { live.finalText = last.final || live.text; finishLive(); live = null; }
          busy = false;
          $("sendBtn").disabled = false; $("sendBtn").classList.remove("busy");
        }
      }
    }
  } catch (e) { /* next tick */ }
}
function stopSync() {
  if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
  if (syncTimer2) { clearInterval(syncTimer2); syncTimer2 = null; }
}

/* ================= frames ================= */
function onFrame(d) {
  if (d.ok !== undefined && replyWaiters[d.id]) {
    const w = replyWaiters[d.id];
    delete replyWaiters[d.id];
    w.resolve(d);
    return;
  }
  if (!live) return;
  // stale-frame guard: only feed frames belonging to the live task's
  // originating request (prevents cross-turn bleeding on quick turns)
  if (live.reqId && d.id && d.id !== live.reqId) return;
  if (d.evt === "dsh") handleDshEvent(d.d);
  else if (d.evt === "error") {
    addErr(d.message || "error");
    if (live) { finishLive(); live = null; }
    busy = false;
    $("sendBtn").disabled = false; $("sendBtn").classList.remove("busy");
  }
}
function releaseBusy() {
  if (live) { live.finalText = live.finalText || live.text; finishLive(); live = null; }
  busy = false;
  $("sendBtn").disabled = false;
  $("sendBtn").classList.remove("busy");
  setStatus(true);
  loadSidebar();
}
function handleDshEvent(ev) {
  if (!live) return;
  const t = ev.type;
  if (t === "session") {
    if (!activeSession) { activeSession = ev.sessionId; store.active = ev.sessionId; }
  } else if (t === "thinking") {
    live.thinking = (live.thinking || "") + (ev.text || "");
    updateLive();
  } else if (t === "text") {
    live.text = (live.text || "") + (ev.text || "");
    updateLive();
  } else if (t === "tool_call") {
    addToolLine(ev.name || ev.tool || "tool");
  } else if (t === "final") {
    live.finalText = ev.text || live.text;
    if (live.taskId) knownTasks[live.taskId] = true;
    releaseBusy();
  } else if (t === "error") {
    addErr(ev.message || "error");
    releaseBusy();
  }
}

/* ================= sending ================= */
async function sendPrompt() {
  if (busy) return;
  const text = $("promptInput").value.trim();
  if (!text) return;
  $("promptInput").value = "";
  $("promptInput").style.height = "auto";
  if (!activeSession) {
    $("msgs").innerHTML = "";
    $("topT1").textContent = "新会话";
  }
  addUserMsg(text);
  busy = true;
  $("sendBtn").disabled = true; $("sendBtn").classList.add("busy");
  const myReqId = "req-" + crypto.randomUUID();   // binds live frames to this turn
  live = { taskId: null, reqId: myReqId, prompt: text, thinking: "", text: "", finalText: null, el: null };
  ensureLive(); setStatus(true);

  const payload = { id: myReqId, kind: "prompt", prompt: text };
  if (activeSession) payload.sessionId = activeSession;
  const r = await bridgeCall("prompt", payload);
  if (!r || !r.ok) {
    addErr((r && r.error) || "发送失败");
    finishLive(); live = null; busy = false;
    $("sendBtn").disabled = false; $("sendBtn").classList.remove("busy");
    return;
  }
  if (r.taskId) { live.taskId = r.taskId; knownTasks[r.taskId] = true; }
  if (r.sessionId && !activeSession) { activeSession = r.sessionId; store.active = r.sessionId; }
  startSync();   // ensure the event streamer is running for this live task
}

/* ================= pairing / refresh / boot ================= */
/* connectivity self-test shown on the pairing screen */
(async function diag() {
  const el = document.getElementById("diag");
  const log = (s) => { el.textContent += s + "\n"; };
  const t0 = performance.now();
  try {
    const r = await fetch("https://rest.ably.io/time", {
      headers: { "Authorization": "Basic " + btoa(ABLY_KEY) } });
    log(`ably REST: HTTP ${r.status} (${Math.round(performance.now() - t0)}ms)`);
  } catch (e) {
    log(`ably REST: FAILED — ${e.message}`);
    log("(公司网络需走代理;浏览器若未使用系统代理会失败)");
  }
  try {
    if (navigator.onLine) log("browser: online");
    else log("browser: OFFLINE");
  } catch (e) {}
})();

async function doPair() {
  const pin = $("pinInput").value.trim();
  $("pairErr").textContent = "";
  if (!/^\d{6}$/.test(pin)) { $("pairErr").textContent = "请输入 6 位 PIN"; return; }
  // local transport: direct HTTP round trip (no Ably at all)
  if (localBase) {
    try {
      const r = await fetch(localBase + "/api", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: "pair-local", kind: "pair", pin, local: true }),
      });
      const resp = await r.json();
      if (!resp || !resp.ok) { $("pairErr").textContent = (resp && resp.error) || "配对失败"; return; }
      store.pairToken = resp.pairToken;
      store.ablyToken = resp.ablyToken || "";
      if (resp.respChannel) store.respChannel = resp.respChannel;
      enterApp();
      return;
    } catch (e) {
      $("pairErr").textContent = "本地桥连不上: " + e.message;
      return;
    }
  }
  const nonce = crypto.getRandomValues(new Uint8Array(16)).reduce(
    (s, b) => s + b.toString(16).padStart(2, "0"), "");
  const pairCh = `dsh-ios-pair-${nonce}`;
  const id = "req-" + crypto.randomUUID();
  const r = await ablyPublish({ id, kind: "pair", pin, nonce });
  if (!r.ok) { $("pairErr").textContent = "网络错误: HTTP " + r.status + "(详见下方诊断)"; return; }
  const resp = await pollChannelFor(pairCh, m => m.id === id, 25000);
  if (!resp) { $("pairErr").textContent = "配对超时: 请求已发出但 25 秒内无响应(桥可能不在线)"; return; }
  if (!resp.ok) { $("pairErr").textContent = resp.error || "配对失败"; return; }
  store.pairToken = resp.pairToken;
  store.ablyToken = resp.ablyToken;
  if (resp.respChannel) store.respChannel = resp.respChannel;
  enterApp();
}
async function pollChannelFor(channel, match, timeoutMs) {
  const t0 = Date.now();
  while (Date.now() - t0 < timeoutMs) {
    try {
      const q = new URLSearchParams({ limit: "20", direction: "backwards" });
      const r = await ablyRest("GET", `/channels/${channel}/messages?${q}`);
      if (r.ok && Array.isArray(r.json)) {
        for (const m of r.json.slice().reverse()) {
          let d; try { d = JSON.parse(m.data); } catch (e) { continue; }
          if (match(d)) return d;
        }
      }
    } catch (e) {}
    await new Promise(res => setTimeout(res, 1200));
  }
  return null;
}
async function verifyPairing() {
  if (!store.pairToken) return false;
  // local transport: verify directly
  if (localBase) {
    try {
      const r = await fetch(localBase + "/api", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: "verify-local", kind: "ping", pairToken: store.pairToken }),
      });
      const resp = await r.json();
      if (resp && resp.ok === false) {
        store.pairToken = ""; store.ablyToken = ""; store.respChannel = "";
        return false;
      }
      if (resp && resp.ablyToken) store.ablyToken = resp.ablyToken;
      return true;
    } catch (e) {
      // local bridge vanished: fall through to Ably path
      localBase = null;
    }
  }
  const nonce = crypto.getRandomValues(new Uint8Array(16)).reduce(
    (s, b) => s + b.toString(16).padStart(2, "0"), "");
  const pairCh = `dsh-ios-pair-${nonce}`;
  const id = "req-" + crypto.randomUUID();
  ablyCred = () => "Basic " + btoa(ABLY_KEY);
  let resp = null;
  try {
    const r = await ablyPublish({ id, kind: "ping", pairToken: store.pairToken, nonce });
    if (r.ok) resp = await pollChannelFor(pairCh, m => m.id === id, 15000);
  } catch (e) {}
  if (resp && resp.ok === false) {
    store.pairToken = ""; store.ablyToken = ""; store.respChannel = "";
    return false;
  }
  if (resp && resp.ok && resp.ablyToken) {
    store.ablyToken = resp.ablyToken;
    if (resp.respChannel) { store.respChannel = resp.respChannel; }
    ablyCred = () => "Bearer " + store.ablyToken;
  } else if (store.ablyToken) {
    ablyCred = () => "Bearer " + store.ablyToken;
  }
  return true;
}
let refreshTimer = null;
async function refreshToken() {
  if (!store.pairToken) return;
  const nonce = crypto.getRandomValues(new Uint8Array(16)).reduce(
    (s, b) => s + b.toString(16).padStart(2, "0"), "");
  const pairCh = `dsh-ios-pair-${nonce}`;
  const id = "req-" + crypto.randomUUID();
  ablyCred = () => "Basic " + btoa(ABLY_KEY);
  const r = await ablyPublish({ id, kind: "refresh", pairToken: store.pairToken, nonce });
  if (!r.ok) { ablyCred = () => "Bearer " + store.ablyToken; scheduleRefresh(5 * 60 * 1000); return; }
  const resp = await pollChannelFor(pairCh, m => m.id === id, 20000);
  if (resp && resp.ok && resp.ablyToken) {
    store.ablyToken = resp.ablyToken;
    ablyCred = () => "Bearer " + store.ablyToken;
    if (resp.respChannel) { store.respChannel = resp.respChannel; CH_RESP = resp.respChannel; }
    authFailures = 0;
    scheduleRefresh();
  } else if (resp && resp.ok === false) {
    if (resp.relogin) { unpair(); return; }
    ablyCred = () => "Bearer " + store.ablyToken;
    scheduleRefresh(5 * 60 * 1000);
  } else {
    ablyCred = () => "Bearer " + store.ablyToken;
    scheduleRefresh(5 * 60 * 1000);
  }
}
function scheduleRefresh(delayMs = 45 * 60 * 1000) {
  if (refreshTimer) clearTimeout(refreshTimer);
  refreshTimer = setTimeout(refreshToken, delayMs);
}
function unpair() {
  stopPolling(); stopSync();
  store.pairToken = ""; store.ablyToken = ""; store.respChannel = "";
  ablyCred = () => "Basic " + btoa(ABLY_KEY);
  $("shell").style.display = "none";
  $("pair").style.display = "flex";
  $("pairErr").textContent = "连接已失效,请重新配对";
}
function enterApp() {
  $("pair").style.display = "none";
  $("shell").style.display = "flex";
  if (localBase) {
    // local transport: no Ably polling; the disk-backed session sync loop
    // and session_events replays carry all state
    setStatus(true);
  } else {
    if (store.ablyToken) {
      ablyCred = () => "Bearer " + store.ablyToken;
      if (store.respChannel) CH_RESP = store.respChannel;
      scheduleRefresh();
    }
    startPolling();
  }
  loadSidebar();
  if (store.active) openSession(store.active);
  else $("msgs").innerHTML = `<div class="hint">从左侧选择一个会话<br>或点「＋ 新建会话」</div>`;
}

/* ================= wiring ================= */
$("pairBtn").onclick = doPair;
$("pinInput").addEventListener("keydown", e => { if (e.key === "Enter") doPair(); });
$("sendBtn").onclick = sendPrompt;
$("promptInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendPrompt(); }
});
$("promptInput").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 140) + "px";
});
$("menuBtn").onclick = () => openDrawer(true);
$("sbBk").onclick = () => openDrawer(false);
$("newChatBtn").onclick = () => {
  openDrawer(false);
  stopSync();
  activeSession = ""; store.active = "";
  knownTasks = {};
  live = null; busy = false;
  $("msgs").innerHTML = "";
  $("topT1").textContent = "新会话";
  $("sendBtn").disabled = false; $("sendBtn").classList.remove("busy");
  loadSidebar();
  $("promptInput").focus();
};

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
    if ($("shell").style.display === "flex") startPolling();
  }
});

(async () => {
  await detectLocalBridge();
  const diagEl = document.getElementById("diag");
  if (diagEl && localBase) diagEl.textContent += "local bridge: 已直连 " + localBase + "\n";
  if (!store.pairToken) {
    // first visit (or cleared credentials): show the pairing screen
    $("pair").style.display = "flex";
    return;
  }
  const ok = await verifyPairing();
  if (ok) enterApp();
  else $("pair").style.display = "flex";
})();
</script>
